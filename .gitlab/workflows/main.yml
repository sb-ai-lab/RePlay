workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

image: "${CI_REGISTRY_IMAGE}:${VERSION}_py310"

variables:
  VERSION: "uv_1.0"
  RUNNER: amazme-1
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: "copy"
  REVIEW_AGENT_OUTPUT_FILE: "review-agent-output.json"

default:
  cache:
    key: ${CI_PROJECT_ID}_uv
    paths:
      - .uv-cache

.wrapper_install: &wrapper_install
  - ./uv_wrapper.sh ${WRAPPER_ARGS} sync ${WRAPPER_EXTRAS}
  - ./uv_wrapper.sh ${WRAPPER_ARGS} --generate

.install_review_agent_deps: &install_review_agent_deps
  - uv pip install --system -q "pydantic>=2,<3"

stages:
  - code_quality
  - docs_quality
  - test_core
  - test_conditional
  - test_torch
  - test_spark
  - test_spark_torch
  - test_models
  - test_experimental
  - merge coverage
  - examples
  - build packages

ruff:
  stage: code_quality
  variables:
    WRAPPER_EXTRAS: --only style
  before_script:
    - *wrapper_install
  script:
    - uv run --no-sync ruff check .
    - uv run --no-sync ruff format . --check
  tags:
    - ${RUNNER}

uv-check:
  stage: code_quality
  script:
    - ./uv_wrapper.sh lock --check
    - ./uv_wrapper.sh --experimental lock --check
  tags:
    - ${RUNNER}

toml-sort:
  stage: code_quality
  variables:
    WRAPPER_EXTRAS: --only style
  before_script:
    - *wrapper_install
  script:
    - ./uv_wrapper.sh --generate
    - uv run --no-sync toml-sort --check pyproject.toml
    - ./uv_wrapper.sh --experimental --generate
    - uv run --no-sync toml-sort --check pyproject.toml
  tags:
    - ${RUNNER}

review-agent:
  stage: code_quality
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
      when: manual
    - when: never

  # Required CI variables:
  # - ANTHROPIC_API_KEY
  # - OPENAI_HTTPS_PROXY or OPENAI_HTTP_PROXY
  # - GITLAB_API_TOKEN

  variables:
    ANTHROPIC_MODEL: "glm-5.2"
    REVIEW_AGENT_OUTPUT_FILE: "review-agent-output.json"

  before_script:
    - *install_review_agent_deps
    - |
      set -euo pipefail

      if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
        echo "Missing CI variable: ANTHROPIC_API_KEY"
        exit 1
      fi

      if [ -z "${GITLAB_API_TOKEN:-}" ]; then
        echo "Missing CI variable: GITLAB_API_TOKEN"
        exit 1
      fi
  script:
    - mkdir -p "$(dirname "$REVIEW_AGENT_OUTPUT_FILE")"
    - BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-$CI_COMMIT_SHA}}"
    - |
      export HTTPS_PROXY="${OPENAI_HTTPS_PROXY:-${OPENAI_HTTP_PROXY:-}}"

      if [ -z "${HTTPS_PROXY:-}" ]; then
        echo "Missing proxy variable: set OPENAI_HTTPS_PROXY or OPENAI_HTTP_PROXY"
        exit 1
      fi
    - |
      python -m scripts.review_agent.cli review \
        --base-sha "$BASE_SHA" \
        --output-path "$REVIEW_AGENT_OUTPUT_FILE"
    - |
      python -m scripts.review_agent.cli publish \
        --api-base "$CI_API_V4_URL" \
        --project-id "$CI_PROJECT_ID" \
        --merge-request-id "$CI_MERGE_REQUEST_IID" \
        --base-sha "$BASE_SHA" \
        --head-sha "$CI_COMMIT_SHA" \
        --review-path "$REVIEW_AGENT_OUTPUT_FILE"
  artifacts:
    when: always
    paths:
      - $REVIEW_AGENT_OUTPUT_FILE
    expire_in: 1 day
  allow_failure: true
  tags:
    - ${RUNNER}

sphinx-job:
  stage: docs_quality
  needs:
    - ruff
    - toml-sort
    - uv-check
  variables:
    WRAPPER_ARGS: --experimental
    WRAPPER_EXTRAS: --no-default-groups --group docs --group conditional
  before_script:
    - *wrapper_install
  script:
    - uv run --no-sync make -C docs clean html
  tags:
    - ${RUNNER}

.pytest_template: &pytest_template
  image: "${CI_REGISTRY_IMAGE}:${VERSION}_${py_version}"
  tags:
    - ${RUNNER}
  needs:
    - ruff
    - toml-sort
    - uv-check
  before_script:
    - export REPLAY_SPARK_CORE_COUNT=4
    - export REPLAY_SPARK_MEMORY=16
    - *wrapper_install
  parallel:
    matrix:
      - py_version:
        - "py310"
        - "py311"
        - "py312"
        - "py313"
        - "py314"

pytest-core:
  <<: *pytest_template
  stage: test_core
  variables:
    WRAPPER_EXTRAS: --no-default-groups --group tests
  script:
    - uv run --no-sync pytest -m core tests/ --ignore=tests/experimental --ignore=tests/conditional
    - mv .coverage .coverage_core_${py_version}
  artifacts:
    paths:
      - .coverage_core_${py_version}
    expire_in: 1 day

pytest-conditional:
  <<: *pytest_template
  stage: test_conditional
  variables:
    WRAPPER_ARGS: --experimental
    WRAPPER_EXTRAS: --no-default-groups --group tests --group conditional
  script:
    - uv run --no-sync pytest -m conditional tests/ --ignore=tests/experimental
    - mv .coverage .coverage_conditional_${py_version}
  artifacts:
    paths:
      - .coverage_conditional_${py_version}
    expire_in: 1 day

pytest-torch:
  <<: *pytest_template
  stage: test_torch
  variables:
    WRAPPER_EXTRAS: --no-default-groups --group tests --extra torch-cpu
  script:
    - |
      uv run --no-sync pytest \
        -m "not spark and not experimental and not conditional" \
        tests/ \
        --ignore=tests/experimental \
        --ignore=tests/conditional
    - mv .coverage .coverage_torch_${py_version}
  artifacts:
    paths:
      - .coverage_torch_${py_version}
    expire_in: 1 day

pytest-spark:
  <<: *pytest_template
  stage: test_spark
  variables:
    WRAPPER_EXTRAS: --no-default-groups --group tests --extra spark
  script:
    - |
      uv run --no-sync pytest \
        -m "not torch and not experimental and not conditional" \
        tests/ \
        --ignore=tests/experimental \
        --ignore=tests/models \
        --ignore=tests/conditional
    - mv .coverage .coverage_spark_${py_version}
  artifacts:
    paths:
      - .coverage_spark_${py_version}
    expire_in: 1 day

pytest-spark-and-torch:
  <<: *pytest_template
  stage: test_spark_torch
  variables:
    WRAPPER_EXTRAS: --no-default-groups --group tests --extra spark --extra torch-cpu
  script:
    - |
      uv run --no-sync pytest \
        -m "not experimental and not conditional" \
        --ignore=replay/models/nn/sequential/compiled \
        --ignore=replay/experimental \
        --ignore=tests/experimental \
        --ignore=tests/models \
        --ignore=tests/conditional
    - mv .coverage .coverage_spark_and_torch_${py_version}
  artifacts:
    paths:
      - .coverage_spark_and_torch_${py_version}
    expire_in: 1 day

pytest-models:
  <<: *pytest_template
  stage: test_models
  variables:
    WRAPPER_EXTRAS: --no-default-groups --group tests --extra spark --extra torch-cpu
  script:
    - |
      uv run --no-sync pytest \
        -m "not experimental and not conditional" \
        tests/models \
        --ignore=replay/experimental \
        --ignore=tests/experimental \
        --ignore=tests/conditional
    - mv .coverage .coverage_models_${py_version}
  artifacts:
    paths:
      - .coverage_models_${py_version}
    expire_in: 1 day

pytest-experimental:
  <<: *pytest_template
  stage: test_experimental
  parallel:
    matrix:
      - py_version:
        - "py310"
  variables:
    WRAPPER_ARGS: --experimental
    WRAPPER_EXTRAS: --no-default-groups --group tests --group conditional
  script:
    - uv run --no-sync pytest -m "experimental"
    - mv .coverage .coverage_experimental_${py_version}
  artifacts:
    paths:
      - .coverage_experimental_${py_version}
    expire_in: 1 day

merge-coverage:
  stage: merge coverage
  image: "${CI_REGISTRY_IMAGE}:${VERSION}_${py_version}"
  parallel:
    matrix:
      - py_version:
        - "py310"
        - "py311"
        - "py312"
        - "py313"
        - "py314"
  variables:
    WRAPPER_EXTRAS: --no-default-groups --group tests
  before_script:
    - *wrapper_install
  script:
    - uv run --no-sync coverage combine .coverage_*_${py_version}
    - uv run --no-sync coverage xml
    - uv run --no-sync coverage report -m --fail-under=100
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  tags:
    - ${RUNNER}

examples-execute-job:
  before_script:
    - *wrapper_install
  rules:
    - when: never
  stage: examples
  script:
    - export EXAMPLES_EXCLUDE=02_models_comparison.ipynb,06_item2item_recommendations.ipynb
    - cd examples
    - for i in *.ipynb; do [[ ! "$EXAMPLES_EXCLUDE" =~ "$i" ]] && jupyter nbconvert --to notebook --execute $i; done

build-production-package:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  stage: build packages
  tags:
    - ${RUNNER}
  script:
    - export PACKAGE_SUFFIX=.dev${CI_JOB_ID}
    - ./uv_wrapper.sh --generate
    - uv build
    - uv publish --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" --username gitlab-ci-token --password "${CI_JOB_TOKEN}"

build-experimental-package:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  stage: build packages
  tags:
    - ${RUNNER}
  script:
    - export PACKAGE_SUFFIX=.preview${CI_JOB_ID}
    - ./uv_wrapper.sh --experimental --generate
    - uv build
    - uv publish --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" --username gitlab-ci-token --password "${CI_JOB_TOKEN}"
