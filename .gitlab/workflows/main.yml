workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

image: "${CI_REGISTRY_IMAGE}:${VERSION}_py310"

variables:
  VERSION: "0.0.14"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  RUNNER: amazme-1
  REVIEW_AGENT_OUTPUT_FILE: "review-agent-output.json"

.wrapper_install: &wrapper_install
  - ./poetry_wrapper.sh ${WRAPPER_ARGS} sync ${WRAPPER_EXTRAS}
  - ./poetry_wrapper.sh ${WRAPPER_ARGS} --generate

.activate_poetry: &activate_poetry
  - ./poetry_wrapper.sh ${WRAPPER_ARGS} --generate
  - eval $(poetry env activate)

.install_pyspark_by_python: &install_pyspark_by_python
  - |
    if python -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 13) else 1)"; then
      poetry run pip install -q --upgrade "pyspark>=4.0,<4.1"
      echo "Using PySpark 4.0.x for Python >= 3.13"
    else
      echo "Using lock-file PySpark for Python < 3.13"
    fi

.install_conditionals: &install_conditionals
  - *activate_poetry
  - *install_pyspark_by_python
  - |
    poetry run pip install -q --upgrade \
      "numpy<2.5" \
      onnx \
      onnxscript \
      openvino \
      optuna \
      hnswlib \
      fixed-install-nmslib
  - |
    if python -c "import sys; raise SystemExit(0 if sys.version_info < (3, 13) else 1)"; then
      poetry run pip install -q --upgrade \
        git+https://github.com/daviddavo/lightfm.git@f0eb500ead54ab65eb8e1b3890337a7223a35114
      echo "sb-obp and LightAutoML are installed by poetry sync from lock file (no pip upgrade)"
    else
      echo "Skipping LightFM, sb-obp and LightAutoML for Python >= 3.13"
    fi

.install_torch_cpu: &install_torch_cpu
  - |
    pip install -q --upgrade \
      --extra-index-url https://download.pytorch.org/whl/cpu \
      "lightning<3.0.0" \
      "pytorch-optimizer<4" \
      "torch<3.0.0"

.install_review_agent_deps: &install_review_agent_deps
  - pip install -q "pydantic>=2,<3"

stages:
  - code_quality
  - docs_quality
  - test_core
  - test_conditional
  - test_torch
  - test_spark
  - test_spark_torch
  - test_models
  - test_experimental
  - merge coverage
  - examples
  - build packages

ruff:
  stage: code_quality
  variables:
    WRAPPER_EXTRAS: --only style
  before_script:
    - *wrapper_install
  script:
    - *activate_poetry
    - poetry run ruff check .
    - poetry run ruff format . --check
  tags:
    - ${RUNNER}

poetry-check:
  stage: code_quality
  variables:
    WRAPPER_EXTRAS: --only style
  before_script:
    - *wrapper_install
  script:
    - ./poetry_wrapper.sh check
    - ./poetry_wrapper.sh --experimental check
  tags:
    - ${RUNNER}

toml-sort:
  stage: code_quality
  variables:
    WRAPPER_EXTRAS: --only style
  before_script:
    - *wrapper_install
  script:
    - ./poetry_wrapper.sh --generate
    - poetry run toml-sort --check pyproject.toml
    - ./poetry_wrapper.sh --experimental --generate
    - poetry run toml-sort --check pyproject.toml
  tags:
    - ${RUNNER}

review-agent:
  stage: code_quality
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
      when: manual
    - when: never

  # Required CI variables:
  # - ANTHROPIC_API_KEY
  # - OPENAI_HTTP_PROXY
  # - OPENAI_HTTPS_PROXY
  # - GITLAB_API_TOKEN

  variables:
    ANTHROPIC_MODEL: "claude-sonnet-4-20250514"
    ANTHROPIC_API_VERSION: "2023-06-01"
    REVIEW_AGENT_OUTPUT_FILE: "review-agent-output.json"

  before_script:
    - *install_review_agent_deps
    - |
      set -euo pipefail

      if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
        echo "Missing CI variable: ANTHROPIC_API_KEY"
        exit 1
      fi

      if [ -z "${GITLAB_API_TOKEN:-}" ]; then
        echo "Missing CI variable: GITLAB_API_TOKEN"
        exit 1
      fi
  script:
    - mkdir -p "$(dirname "$REVIEW_AGENT_OUTPUT_FILE")"
    - BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-$CI_COMMIT_SHA}}"
    - |
      export HTTPS_PROXY="${HTTPS_PROXY:-${OPENAI_HTTPS_PROXY:-${OPENAI_HTTP_PROXY:-}}}"
      export HTTP_PROXY="${HTTP_PROXY:-${OPENAI_HTTP_PROXY:-${OPENAI_HTTPS_PROXY:-}}}"
      export https_proxy="$HTTPS_PROXY"
      export http_proxy="$HTTP_PROXY"

      if [ -z "${HTTPS_PROXY:-}" ] && [ -z "${HTTP_PROXY:-}" ]; then
        echo "Missing proxy variable: set OPENAI_HTTPS_PROXY or OPENAI_HTTP_PROXY"
        exit 1
      fi
    - |
      python -m scripts.review_agent.cli review \
        --base-sha "$BASE_SHA" \
        --output-path "$REVIEW_AGENT_OUTPUT_FILE"
    - |
      python -m scripts.review_agent.cli publish \
        --api-base "$CI_API_V4_URL" \
        --project-id "$CI_PROJECT_ID" \
        --merge-request-id "$CI_MERGE_REQUEST_IID" \
        --base-sha "$BASE_SHA" \
        --head-sha "$CI_COMMIT_SHA" \
        --review-path "$REVIEW_AGENT_OUTPUT_FILE"
  artifacts:
    when: always
    paths:
      - $REVIEW_AGENT_OUTPUT_FILE
    expire_in: 1 day
  allow_failure: true
  tags:
    - ${RUNNER}

sphinx-job:
  stage: docs_quality
  needs:
    - ruff
    - toml-sort
    - poetry-check
  variables:
    WRAPPER_ARGS: --experimental
    WRAPPER_EXTRAS: --with docs
  before_script:
    - *wrapper_install
    - *install_conditionals
  script:
    - make -C docs clean html
  tags:
    - ${RUNNER}
  
