name: CI Pipeline

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, refactoring]
  workflow_dispatch:

jobs:
  static_tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: "3.10"
      - name: install_style_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          groups: "style"
      - name: ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format . --check --diff
      - name: uv-check
        run: |
          ./uv_wrapper.sh lock --check
          ./uv_wrapper.sh --experimental lock --check
      - name: toml-sort
        run: |
          ./uv_wrapper.sh --generate
          uv run --no-sync toml-sort --check pyproject.toml
          ./uv_wrapper.sh --experimental --generate
          uv run --no-sync toml-sort --check pyproject.toml

  pytest_core:
    needs: static_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_core_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          groups: "tests"
      - name: pytest
        run: |
          uv run --no-sync pytest -m core tests/ --ignore=tests/experimental --ignore=tests/conditional
          mv .coverage coverage_core_${{ matrix.python-version }}
      - name: upload_coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage_core_${{ matrix.python-version }}
          path: coverage_core_${{ matrix.python-version }}

  pytest_conditional:
    needs: static_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_experimental_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          experimental: "true"
          groups: "tests"
          conditional: "true"
          java: "true"
      - name: pytest
        run: |
          uv run --no-sync pytest -m conditional tests/ --ignore=tests/experimental
          mv .coverage coverage_conditional_${{ matrix.python-version }}
      - name: upload_coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage_conditional_${{ matrix.python-version }}
          path: coverage_conditional_${{ matrix.python-version }}

  pytest_torch:
    needs: static_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_torch_cpu_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          groups: "tests"
          extras: "torch-cpu"
      - name: pytest
        run: |
          uv run --no-sync pytest -m "not spark and not experimental and not conditional" tests/ --ignore=tests/experimental --ignore=tests/conditional
          mv .coverage coverage_torch_${{ matrix.python-version }}
      - name: upload_coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage_torch_${{ matrix.python-version }}
          path: coverage_torch_${{ matrix.python-version }}

  pytest_spark:
    needs: static_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_spark_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          groups: "tests"
          extras: "spark"
          java: "true"
      - name: pytest
        run: |
          uv run --no-sync pytest -m "not torch and not experimental and not conditional" tests/ --ignore=tests/experimental --ignore=tests/models --ignore=tests/conditional
          mv .coverage coverage_spark_${{ matrix.python-version }}
      - name: upload_coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage_spark_${{ matrix.python-version }}
          path: coverage_spark_${{ matrix.python-version }}

  pytest_spark_torch:
    needs: static_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_spark_torch_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          groups: "tests"
          extras: "spark torch-cpu"
          java: "true"
      - name: pytest
        run: |
          uv run --no-sync pytest -m "not experimental and not conditional" --ignore=replay/models/nn/sequential/compiled --ignore=replay/experimental --ignore=tests/experimental --ignore=tests/models --ignore=tests/conditional
          mv .coverage coverage_spark_and_torch_${{ matrix.python-version }}
      - name: upload_coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage_spark_and_torch_${{ matrix.python-version }}
          path: coverage_spark_and_torch_${{ matrix.python-version }}

  pytest_experimental:
    needs: static_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_experimental_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          experimental: "true"
          groups: "tests"
          conditional: "true"
          java: "true"
      - name: pytest
        run: |
          uv run --no-sync pytest -m "experimental" tests/
          mv .coverage coverage_experimental_${{ matrix.python-version }}
      - name: upload_coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage_experimental_${{ matrix.python-version }}
          path: coverage_experimental_${{ matrix.python-version }}

  pytest_models:
    needs: static_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_spark_torch_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          groups: "tests"
          extras: "spark torch-cpu"
          java: "true"
      - name: pytest
        run: |
          uv run --no-sync pytest -m "not experimental and not conditional" tests/models --ignore=replay/experimental --ignore=tests/experimental --ignore=tests/conditional
          mv .coverage coverage_models_${{ matrix.python-version }}
      - name: upload_coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage_models_${{ matrix.python-version }}
          path: coverage_models_${{ matrix.python-version }}

  merge_coverage:
    needs: [pytest_core, pytest_conditional, pytest_torch, pytest_spark, pytest_spark_torch, pytest_models, pytest_experimental]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: install_tests_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          groups: "tests"
      - name: download_coverage_reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage_*
          merge-multiple: true
      - name: combine_coverage
        run: |
          uv run --no-sync coverage combine coverage_*_${{ matrix.python-version }}
          uv run --no-sync coverage report --fail-under=100
          uv run --no-sync coverage xml

  build_production:
    needs: merge_coverage
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: "3.10"
      - name: build
        run: |
          export PACKAGE_SUFFIX=.dev
          ./uv_wrapper.sh --generate
          uv build

  build_experimental:
    needs: merge_coverage
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: "3.10"
      - name: build
        run: |
          export PACKAGE_SUFFIX=.preview
          ./uv_wrapper.sh --experimental --generate
          uv build
