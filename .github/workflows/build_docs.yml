name: Build Docs

# Controls when the workflow will run. Main workflow events
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, refactoring]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: ci_setup
        uses: ./.github/actions/ci-setup
        with:
          python-version: "3.10"
      - name: install_experimental_docs_dependencies
        uses: ./.github/actions/install-uv-deps
        with:
          experimental: "true"
          groups: "docs"
          conditional: "true"
      - name: Build docs
        run: uv run --no-sync make -C docs clean html
