name: "CI Setup"
description: "Composite action to prepare Python and uv for CI"

inputs:
  python-version:
    description: "Python version to install in the runner"
    required: true
    default: "3.10"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.3"
        enable-cache: true

    - name: Setup Python
      shell: bash
      env:
        CI_PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv python install "$CI_PYTHON_VERSION"
